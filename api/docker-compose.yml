services:
  mermaid-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    ports:
      - "3200:3200"
    environment:
      - PORT=3200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3200/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
